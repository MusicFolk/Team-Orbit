<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orbit — Admin · Comments</title>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f6fb; color:#2c2c34; }
        .wrap { max-width:900px; margin:0 auto; padding:32px 24px; }
        h1 { color:#1E2761; font-size:22px; margin:0 0 20px 0; }
        .tab-bar { display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid #e1e4ec; }
        .tab-bar a { padding:10px 16px; font-size:13.5px; font-weight:600; color:#6b6f80; text-decoration:none; border-bottom:2px solid transparent; margin-bottom:-1px; }
        .tab-bar a.active { color:#1E2761; border-bottom:2px solid #1E2761; }
        .empty-note { font-size:12px; color:#6b6f80; background:#fffbe8; border:1px solid #f2e5a8; padding:10px 14px; border-radius:8px; margin-bottom:20px; }
        .card { background:#fff; border:1px solid #e1e4ec; border-radius:10px; overflow:hidden; }
        table { width:100%; border-collapse:collapse; font-size:13.5px; }
        th { text-align:left; background:#1E2761; color:#fff; padding:10px 14px; font-size:12px; text-transform:uppercase; }
        td { padding:10px 14px; border-bottom:1px solid #e1e4ec; vertical-align:middle; }
        tr:last-child td { border-bottom:none; }
        .btn-sm { padding:6px 12px; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer; }
        .btn-danger { background:#fdeceb; color:#c94a4a; border:1px solid #f3c8c4; }
        .empty { color:#6b6f80; font-size:14px; padding:24px; text-align:center; }
    </style>
</head>
<body>

<div class="wrap">
    <h1>Admin Dashboard</h1>
    <div class="tab-bar">
        <a th:href="@{/api/admin/users}">Users</a>
        <a th:href="@{/api/admin/events}">Events</a>
        <a class="active" th:href="@{/api/admin/comments}">Comments</a>
    </div>

    <div class="empty-note">Comments flagged by users appear here for review.</div>

    <div class="card">
        <table th:if="${not #lists.isEmpty(comments)}">
            <tr><th>Author</th><th>Event</th><th>Comment</th><th>Actions</th></tr>
            <tr th:each="c : ${comments}">
                <td th:text="${c.authorName}">Author</td>
                <td th:text="${c.eventTitle}">Event</td>
                <td th:text="${c.text}">Comment text</td>
                <td>
                    <form th:action="@{/api/admin/comments/{id}(id=${c.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" name="_method" value="delete"/>
                        <button type="submit" class="btn-sm btn-danger">Remove</button>
                    </form>
                </td>
            </tr>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(comments)}">No comments to review.</p>
    </div>
</div>

</body>
</html>
