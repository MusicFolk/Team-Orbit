<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Orbit — Log In</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6fb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      width: 100%;
      max-width: 360px;
      background: #ffffff;
      border: 1px solid #e1e4ec;
      border-radius: 10px;
      padding: 32px;
    }
    h1 {
      color: #1E2761;
      font-size: 24px;
      margin: 0 0 4px 0;
    }
    .subtitle {
      color: #6b6f80;
      font-size: 14px;
      margin: 0 0 20px 0;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin: 14px 0 6px 0;
    }
    input[type=email], input[type=password] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e1e4ec;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 10px 18px;
      background: #1E2761;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #141a47; }
    .helper {
      margin-top: 18px;
      font-size: 13.5px;
      color: #6b6f80;
      text-align: center;
    }
    .helper a { color: #1E2761; }
    .alert {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .alert-error {
      background: #fdeceb;
      color: #c94a4a;
      border: 1px solid #f3c8c4;
    }
    .alert-success {
      background: #e5f5eb;
      color: #2f8f5b;
      border: 1px solid #b8e0c8;
    }
  </style>
</head>
<body>

<div class="login-card">
  <h1>Orbit</h1>
  <p class="subtitle">Log in to your account</p>

  <!-- Spring Security appends ?error / ?logout to the redirect URL -->
  <div class="alert alert-error" th:if="${param.error}">
    Invalid email or password.
  </div>
  <div class="alert alert-success" th:if="${param.logout}">
    You have been logged out.
  </div>

  <form th:action="@{/login}" method="post">
    <!-- CSRF token required by default when Spring Security is on the classpath -->
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <label for="email">Email</label>
    <input type="email" id="email" name="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button type="submit">Log In</button>
  </form>

  <p class="helper">Don't have an account? <a th:href="@{/register}">Register</a></p>
</div>

</body>
</html>
