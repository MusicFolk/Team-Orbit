<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Orbit — Log In</title>

  <style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    body{

        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;

        background:
                linear-gradient(rgba(15,23,42,.45),rgba(15,23,42,.45)),
                url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?auto=format&fit=crop&w=1600&q=80');

        background-size:cover;
        background-position:center;
        background-repeat:no-repeat;
    }

    .login-card{

        width:100%;
        max-width:420px;

        background:rgba(255,255,255,.95);

        backdrop-filter:blur(12px);

        border-radius:18px;

        padding:40px;

        box-shadow:0 15px 45px rgba(0,0,0,.25);

    }

    h1{

        color:#1E2761;

        font-size:46px;

        margin-bottom:10px;

    }

    .subtitle{

        color:#5f6475;

        margin-bottom:30px;

        font-size:18px;

    }

    label{

        display:block;

        margin-top:18px;

        margin-bottom:8px;

        font-weight:600;

    }

    input{

        width:100%;

        padding:14px;

        border:1px solid #d7dbe7;

        border-radius:10px;

        font-size:15px;

    }

    input:focus{

        outline:none;

        border:2px solid #2b59ff;

    }

    button{

        width:100%;

        margin-top:28px;

        padding:15px;

        border:none;

        border-radius:10px;

        background:#1E2761;

        color:white;

        font-size:18px;

        font-weight:bold;

        cursor:pointer;

        transition:.3s;

    }

    button:hover{

        background:#16204f;

    }

    .helper{

        text-align:center;

        margin-top:25px;

        color:#666;

    }

    .helper a{

        color:#1E2761;

        font-weight:bold;

        text-decoration:none;

    }

    .alert{

        padding:12px;

        margin-bottom:20px;

        border-radius:10px;

        font-size:14px;

    }

    .alert-error{

        background:#ffe8e8;

        color:#b00020;

    }

    .alert-success{

        background:#e7ffe8;

        color:#0b7d32;

    }

  </style>

</head>

<body>

<div class="login-card">

  <h1>Orbit</h1>

  <p class="subtitle">Log in to your account</p>

  <div class="alert alert-error" th:if="${param.error}">
    Invalid username or password.
  </div>

  <div class="alert alert-success" th:if="${param.logout}">
    You have been logged out.
  </div>

  <form th:action="@{/api/auth/login}" method="post">

    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}"/>

    <label>Username</label>

    <input
            type="text"
            name="username"
            required
            autofocus>

    <label>Password</label>

    <input
            type="password"
            name="password"
            required>

    <button type="submit">

      Log In

    </button>

  </form>

  <p class="helper">

    Don't have an account?

    <a th:href="@{/api/auth/register}">

      Register

    </a>

  </p>

</div>

</body>
</html>
