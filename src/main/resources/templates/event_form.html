<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Edit Event — Orbit' : 'Create Event — Orbit'">Orbit — Event Form</title>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f6fb; color:#2c2c34; }
        .wrap { max-width:600px; margin:0 auto; padding:32px 24px; }
        h1 { color:#1E2761; font-size:24px; margin:0 0 20px 0; }
        .card { background:#fff; border:1px solid #e1e4ec; border-radius:10px; padding:24px; box-sizing:border-box; }
        label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px 0; }
        label:first-child { margin-top:0; }
        input[type=text], input[type=datetime-local], input[type=number], select, textarea {
            width:100%; padding:10px 12px; border:1px solid #e1e4ec; border-radius:6px;
            font-size:14px; font-family:inherit; box-sizing:border-box;
        }
        textarea { resize:vertical; min-height:80px; }
        .row-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        .btn-row { margin-top:20px; display:flex; gap:10px; }
        .btn { padding:10px 18px; border-radius:6px; border:none; font-size:14px; font-weight:600; cursor:pointer; }
        .btn-primary { background:#1E2761; color:#fff; }
        .btn-secondary { background:#eef3fd; color:#1E2761; border:1px solid #CADCFC; text-decoration:none; display:inline-flex; align-items:center; }
        .btn-danger { background:#fdeceb; color:#c94a4a; border:1px solid #f3c8c4; margin-left:auto; }
        .field-error { color:#c94a4a; font-size:12px; margin-top:4px; }
    </style>
</head>
<body>

<div class="wrap">
    <h1 th:text="${isEdit} ? 'Edit Event' : 'Create Event'">Create Event</h1>

    <div class="card">
        <form th:action="${isEdit} ? @{/events/{id}(id=${eventId})} : @{/events}"
              th:object="${eventForm}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="_method" value="put" th:if="${isEdit}"/>

            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required>
            <p class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>

            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}"></textarea>
            <p class="field-error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>

            <div class="row-2">
                <div>
                    <label for="location">Location</label>
                    <input type="text" id="location" th:field="*{location}" required>
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" th:field="*{category}">
                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}"></option>
                    </select>
                </div>
            </div>

            <label for="eventDateTime">Date & Time</label>
            <input type="datetime-local" id="eventDateTime" th:field="*{eventDateTime}" required>
            <p class="field-error" th:if="${#fields.hasErrors('eventDateTime')}" th:errors="*{eventDateTime}"></p>

            <label for="capacity">Capacity</label>
            <input type="number" id="capacity" th:field="*{capacity}" min="1" required>

            <div class="btn-row">
                <button type="submit" class="btn btn-primary"
                        th:text="${isEdit} ? 'Save Changes' : 'Create Event'">Save</button>
                <a class="btn btn-secondary" th:href="@{/events}">Cancel</a>

                <button type="submit" form="deleteForm" class="btn btn-danger"
                        th:if="${isEdit}" style="margin-left:auto">Delete Event</button>
            </div>
        </form>

        <form th:if="${isEdit}" id="deleteForm"
              th:action="@{/events/{id}(id=${eventId})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="_method" value="delete"/>
        </form>
    </div>
</div>

</body>
</html>
