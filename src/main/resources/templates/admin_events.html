<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Orbit — Admin · Events</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f6fb; color:#2c2c34; }
    .wrap { max-width:900px; margin:0 auto; padding:32px 24px; }
    h1 { color:#1E2761; font-size:22px; margin:0 0 20px 0; }
    .tab-bar { display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid #e1e4ec; }
    .tab-bar a { padding:10px 16px; font-size:13.5px; font-weight:600; color:#6b6f80; text-decoration:none; border-bottom:2px solid transparent; margin-bottom:-1px; }
    .tab-bar a.active { color:#1E2761; border-bottom:2px solid #1E2761; }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .toolbar input { width:220px; padding:8px 12px; border:1px solid #e1e4ec; border-radius:6px; font-size:13.5px; }
    .card { background:#fff; border:1px solid #e1e4ec; border-radius:10px; overflow:hidden; }
    table { width:100%; border-collapse:collapse; font-size:13.5px; }
    th { text-align:left; background:#1E2761; color:#fff; padding:10px 14px; font-size:12px; text-transform:uppercase; }
    td { padding:10px 14px; border-bottom:1px solid #e1e4ec; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    .actions form { display:inline; }
    .btn-sm { padding:6px 12px; font-size:12.5px; font-weight:600; border-radius:6px; cursor:pointer; border:1px solid #CADCFC; background:#eef3fd; color:#1E2761; text-decoration:none; display:inline-block; }
    .btn-danger { background:#fdeceb; color:#c94a4a; border:1px solid #f3c8c4; margin-left:6px; }
  </style>
</head>
<body>

<div class="wrap">
  <h1>Admin Dashboard</h1>
  <div class="tab-bar">
    <a th:href="@{/admin/users}">Users</a>
    <a class="active" th:href="@{/admin/events}">Events</a>
    <a th:href="@{/admin/comments}">Comments</a>
    <a th:href="@{/events}" style="margin-left:auto; align-self:center; padding:6px 14px; border:1px solid #CADCFC; background:#eef3fd; color:#1E2761; border-radius:6px;">← Back to App</a>
  </div>

  <div class="toolbar">
    <form th:action="@{/admin/events}" method="get">
      <input type="text" name="search" th:value="${param.search}" placeholder="Search events...">
    </form>
  </div>

  <div class="card">
    <table>
      <tr><th>Title</th><th>Organizer</th><th>Date</th><th>Actions</th></tr>
      <tr th:each="e : ${events}">
        <td th:text="${e.title}">Event Title</td>
        <td th:text="${e.organizer.fullName}">Organizer</td>
        <td th:text="${e.eventDateTime.toLocalDate()}">01 Jan 2026</td>
        <td class="actions">
          <form th:action="@{/admin/events/{id}(id=${e.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <input type="hidden" name="_method" value="delete"/>
            <button type="submit" class="btn-sm btn-danger">Remove</button>
          </form>
        </td>
      </tr>
    </table>
  </div>
</div>

</body>
</html>
