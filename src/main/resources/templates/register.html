<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Orbit — Register</title>
    <style>
        body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f6fb; display:flex; align-items:center; justify-content:center; min-height:100vh; }
        .card { width:100%; max-width:380px; background:#fff; border:1px solid #e1e4ec; border-radius:10px; padding:32px; box-sizing:border-box; }
        h1 { color:#1E2761; font-size:24px; margin:0 0 4px 0; }
        .subtitle { color:#6b6f80; font-size:14px; margin:0 0 20px 0; }
        label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px 0; }
        input[type=text], input[type=email], input[type=password] { width:100%; padding:10px 12px; border:1px solid #e1e4ec; border-radius:6px; font-size:14px; box-sizing:border-box; }
        button { width:100%; margin-top:20px; padding:10px 18px; background:#1E2761; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
        button:hover { background:#141a47; }
        .helper { margin-top:18px; font-size:13.5px; color:#6b6f80; text-align:center; }
        .helper a { color:#1E2761; }
        .field-error { color:#c94a4a; font-size:12px; margin-top:4px; }
        .alert-error { background:#fdeceb; color:#c94a4a; border:1px solid #f3c8c4; font-size:13px; padding:10px 12px; border-radius:6px; margin-bottom:16px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Orbit</h1>
    <p class="subtitle">Create your account</p>

    <div class="alert-error" th:if="${registrationError}" th:text="${registrationError}">
        Registration failed.
    </div>

    <!-- th:object binds to a RegisterRequest-shaped model attribute set by the controller -->
    <form th:action="@{/api/auth/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <label for="username">Username</label>
        <input type="text" id="username" th:field="*{username}" required autofocus>
        <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" th:field="*{fullName}" required>
        <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" required>
        <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

        <label for="password">Password</label>
        <input type="password" id="password" th:field="*{password}" required>
        <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

        <button type="submit">Create Account</button>
    </form>

    <p class="helper">Already have an account? <a th:href="@{/api/auth/login}">Log in</a></p>
</div>

</body>
</html>
