services:
  db:
    image: postgres:16
    container_name: orbit-db
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit_user
      POSTGRES_PASSWORD: orbit_pass
    ports:
      - "5432:5432"
    volumes:
      - orbit-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: orbit-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/orbit
      SPRING_DATASOURCE_USERNAME: orbit_user
      SPRING_DATASOURCE_PASSWORD: orbit_pass

volumes:
  orbit-db-data:
